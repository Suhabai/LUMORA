<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMORA — PNG Export Utility — Brand Assets</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:#0a0a0a;color:#e0e0e0;font-size:13px;padding:30px}
h1{font-size:14px;letter-spacing:4px;text-transform:uppercase;color:#888;font-weight:400;margin-bottom:8px}
p{font-size:11px;color:#555;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.card{background:#111;border:1px solid #222;padding:16px}
.card h2{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:8px}
.card .size{font-size:9px;color:#555;margin-bottom:8px}
.preview{background:#fff;border:1px solid #333;padding:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
button{background:#222;color:#ccc;border:1px solid #444;font-family:inherit;font-size:11px;padding:6px 12px;cursor:pointer;letter-spacing:1px}
button:hover{background:#333;color:#fff}
.note{font-size:9px;color:#555;margin-top:8px}
</style>
</head>
<body>

<h1>LUMORA — PNG Export Utility</h1>
<p>Export PNG files from SVG sources. All exports use transparent backgrounds.</p>

<div class="grid" id="exports"></div>

<script>
const SVG_PATHS={
  micro:'../micro-mark/lumora-micro-16.svg',
  wordmark:'../wordmark/lumora-wordmark-master.svg'
};

const EXPORTS=[
  {label:'Favicon 16px',path:SVG_PATHS.micro,size:16,filename:'favicon-16.png'},
  {label:'Favicon 32px',path:SVG_PATHS.micro,size:32,filename:'favicon-32.png'},
  {label:'Favicon 48px',path:SVG_PATHS.micro,size:48,filename:'favicon-48.png'},
  {label:'Apple Touch 180px',path:SVG_PATHS.micro,size:180,filename:'apple-touch-icon.png'},
  {label:'OG Black (1200x630)',path:SVG_PATHS.wordmark,size:0,filename:'lumora-og-black.png',custom:true,w:1200,h:630},
  {label:'OG White (1200x630)',path:SVG_PATHS.wordmark,size:0,filename:'lumora-og-white.png',custom:true,w:1200,h:630}
];

async function exportPNG(svgPath,width,height,filename,bg){
  const resp=await fetch(svgPath);
  const svgText=await resp.text();
  const blob=new Blob([svgText],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);

  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement('canvas');
    canvas.width=width;
    canvas.height=height;
    const ctx=canvas.getContext('2d');
    if(bg){ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);}
    if(bg){
      const scale=Math.min((width*0.4)/img.naturalWidth,(height*0.3)/img.naturalHeight);
      const sw=img.naturalWidth*scale,sh=img.naturalHeight*scale;
      ctx.drawImage(img,(width-sw)/2,(height-sh)/2,sw,sh);
    }else{
      const scale=Math.min(width/img.naturalWidth,height/img.naturalHeight);
      const sw=img.naturalWidth*scale,sh=img.naturalHeight*scale;
      ctx.drawImage(img,(width-sw)/2,(height-sh)/2,sw,sh);
    }
    URL.revokeObjectURL(url);
    canvas.toBlob(pngBlob=>{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(pngBlob);
      a.download=filename;
      a.click();
      URL.revokeObjectURL(a.href);
    },'image/png');
  };
  img.src=url;
}

function render(){
  const container=document.getElementById('exports');
  let html='';
  for(const exp of EXPORTS){
    const displaySize=exp.custom?Math.min(exp.w,200):exp.size;
    html+=`<div class="card">
      <h2>${exp.label}</h2>
      <div class="size">${exp.custom?exp.w+'x'+exp.h:exp.size+'px'}</div>
      <div class="preview"><img src="${exp.path}" style="height:${Math.min(displaySize,80)}px"></div>
      <button onclick="exportPNG('${exp.path}',${exp.custom?exp.w:exp.size},${exp.custom?exp.h:exp.size},'${exp.filename}','${exp.filename.includes('og-black')?'#000':exp.filename.includes('og-white')?'#fff':""}')">Export ${exp.filename}</button>
      <div class="note">Transparent background PNG</div>
    </div>`;
  }
  container.innerHTML=html;
}

render();
</script>
</body>
</html>
