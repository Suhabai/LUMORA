<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">LUMORA experimental direction C — Core / M Hybrid</title>
  <desc id="desc">A still circular signature whose internal negative space quietly carries the structural V dip of the M Core.</desc>
