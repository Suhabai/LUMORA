  <g transform="translate(88 556)"><text class="label" y="-24">SYMBOL</text><path class="violet" fill-rule="evenodd" d="M84 8A76 76 0 1 1 84 160A76 76 0 1 1 84 8ZM45 43V122H58V66L84 102L110 66V122H123V43H109L84 79L59 43Z" transform="scale(.72)"/></g>
