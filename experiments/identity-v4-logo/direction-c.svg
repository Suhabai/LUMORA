    <filter id="c-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="17"/></filter>
    <style>.bg{fill:#07070a}.violet{fill:#b96cff}.mono{fill:#f5f5f7}.word{fill:#f5f5f7;font:300 54px Arial,sans-serif;letter-spacing:18px}.label{fill:#7a7a8e;font:500 14px Arial,sans-serif;letter-spacing:3px}.rule{stroke:#fff;stroke-opacity:.09}</style>
  </defs>
