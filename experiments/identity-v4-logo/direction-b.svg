    <filter id="b-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="16"/></filter>
    <style>.bg{fill:#07070a}.ring{fill:none;stroke:#b96cff;stroke-width:25;stroke-linecap:round}.mono{fill:none;stroke:#f5f5f7;stroke-width:25;stroke-linecap:round}.word{fill:#f5f5f7;font:300 54px Arial,sans-serif;letter-spacing:18px}.label{fill:#7a7a8e;font:500 14px Arial,sans-serif;letter-spacing:3px}.rule{stroke:#fff;stroke-opacity:.09}</style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="24"/>
