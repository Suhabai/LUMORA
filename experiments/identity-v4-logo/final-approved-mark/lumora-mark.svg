    <linearGradient id="lumora-violet" x1="15%" y1="80%" x2="88%" y2="18%"><stop offset="0" stop-color="#8d46d8"/><stop offset=".42" stop-color="#b96cff"/><stop offset=".72" stop-color="#ffffff"/><stop offset=".86" stop-color="#e3a4ff"/><stop offset="1" stop-color="#9a4ee5"/></linearGradient>
    <filter id="lumora-bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g fill="none" stroke="url(#lumora-violet)" stroke-linecap="round" filter="url(#lumora-bloom)">
