<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">LUMORA luminous event-horizon mark</title>
  <desc id="desc">A still luminous near-complete ring with organic interruptions and asymmetric light beads around a transparent center.</desc>
